<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com https://*.google.com; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://content.googleapis.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1795639119">
</head>
<body>

  <section id="gate" class="gate">
    <div class="gate-box">
      <p class="gate-title">conversion alchemy finance</p>
      <button class="primary-button" id="signIn" type="button">sign in with google</button>
      <p class="gate-error" id="gateError" hidden></p>
    </div>
  </section>

  <header class="top" id="top" hidden>
    <div class="brand">
      <label class="brand-pick"><select id="brandPick" aria-label="menu"><option value="" id="brandName" selected hidden>finance</option><option value="open">open file</option><option value="sheets">open in google sheets</option><option value="signout">sign out</option></select></label>
      <div class="seg mode" id="modePick" role="group" aria-label="business or personal"></div>
      <span class="status" id="status"></span>
    </div>
    <button class="box icon" id="refreshButton" type="button" title="refresh" aria-label="refresh"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M16 10a6 6 0 1 1-1.76-4.24"/><path d="M16 3.5v3h-3"/></svg></button>
  </header>

  <main id="app" hidden>
    <div class="views">
    <section id="viewDashboard" class="view" hidden>
      <div class="dash-main">
        <div class="filters">
          <label class="box" id="jumpBox"><select id="jumpPick" aria-label="go to section"></select></label>
          <span class="spacer"></span>
          <label class="box" id="coBox"><select id="scopePick" aria-label="company"></select></label>
          <div class="seg step" role="group" aria-label="period"><span id="periodPick" class="contents"></span><button type="button" class="prev" aria-label="previous year">‹</button><label><select id="yearPick" aria-label="year"></select></label><button type="button" class="next" aria-label="next year">›</button></div>
          <button class="box" id="monthChip" type="button" hidden></button>
          <button class="box icon" id="pdfButton" type="button" title="export" aria-label="export"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 7.5H4.5v9h11v-9H13"/><path d="M10 12.5V2.5M6.5 6L10 2.5 13.5 6"/></svg></button>
        </div>
        <div class="sec summary"><b>summary</b><div class="split"><div id="summary"></div><div id="monthChart"></div></div></div>
        <div class="sec"><b id="flowTitle">revenue and costs</b><div class="split"><div class="pick" id="flowList"></div><div id="flowDetail"></div></div></div>
        <div class="sec"><b>cash</b><div class="split"><div class="pick" id="cashList"></div><div id="cashDetail"></div></div></div>
        <div class="sec"><div class="sec-label"><b>budget</b><div class="tools" id="budgetTools"></div></div><div id="budgetBody"></div></div>
        <div class="sec"><b>filings</b><div id="filingList"></div></div>
        <div class="sec" id="txSec"><div class="sec-label"><b>transactions</b><div class="tools"><button class="box" id="txSeeAll" type="button">see all</button></div></div><div id="txPreview"></div></div>
      </div>
    </section>
    <section id="viewSheet" class="view" hidden>
      <div class="sheet-head" id="sheetHead"></div>
      <div class="sheet-scroll" id="sheetScroll"><table class="grid" id="grid"></table><div id="more"></div></div>
    </section>
    </div>
    <aside class="side-col"><div class="side" id="filingsBox"></div><div class="side" id="attention"></div><div class="side" id="tasksBox"></div></aside>
  </main>
  <dialog class="paste" id="budPaste" aria-label="paste from ai">
    <textarea id="budPasteText" spellcheck="false" aria-label="budget"></textarea>
    <p class="r" id="budPasteError" hidden></p>
    <div class="actions"><button class="box" id="budPasteCopy" type="button">copy for ai</button><span class="spacer"></span><button class="box" id="budPasteCancel" type="button">cancel</button><button class="box primary" id="budPasteApply" type="button">apply</button></div>
  </dialog>
  <footer class="mark">ConversionAlchemy.com</footer>

  <div class="modal" id="txModal" hidden>
    <div class="modal-box">
      <div class="modal-hd"><b id="txmTitle"></b><i id="txmCount"></i><button class="xbtn" id="txmClose" type="button" title="close" aria-label="close"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button></div><div class="sheet-head" id="txmHead"></div>
      <div class="modal-body"><table class="grid tx" id="txmGrid"></table><div id="txmMore"></div></div>
    </div>
  </div>
  <div id="print" class="print"></div>
  <script src="app.js?v=1795639119"></script>
</body>
</html>
