<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com https://*.google.com; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://content.googleapis.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section id="gate" class="gate">
    <div class="gate-box">
      <p class="gate-title">conversion alchemy finance</p>
      <button class="primary-button" id="signIn" type="button">sign in with google</button>
      <p class="gate-error" id="gateError" hidden></p>
    </div>
  </section>

  <main id="app" hidden>
    <section id="viewDashboard" class="view" hidden>
      <div class="dash-head">
        <label class="select-wrap"><span class="visually-label">show</span><select id="scopePick"></select></label>
        <div class="segmented" id="currencyPick" role="group" aria-label="currency"></div>
        <label class="select-wrap"><span class="visually-label">year</span><select id="yearPick"></select></label>
        <div class="segmented" id="quarterPick" role="group" aria-label="quarter"></div>
        <button class="chip" id="monthChip" type="button" hidden></button>
        <p class="dash-range" id="rangeLabel"></p>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="grid-2">
        <div class="panel wide"><p class="panel-title">income and costs by month</p><div id="monthChart" class="chart-box"></div></div>
        <div class="panel"><p class="panel-title">costs by category</p><div id="costBars"></div></div>
      </div>
      <div class="grid-3">
        <div class="panel"><p class="panel-title">fees</p><div id="feesPanel"></div></div>
        <div class="panel" id="marginPanelWrap"><p class="panel-title">contribution margin</p><div id="marginPanel"></div></div>
        <div class="panel"><p class="panel-title">recurring costs</p><div id="recurringPanel"></div></div>
      </div>
      <div class="grid-3">
        <div class="panel"><p class="panel-title">cash at period end</p><div id="cashPanel"></div></div>
        <div class="panel" id="taxPanelWrap"><p class="panel-title">tax</p><div id="taxPanel"></div></div>
        <div class="panel"><p class="panel-title">needs attention</p><div id="attentionPanel"></div></div>
      </div>
    </section>
    <section id="viewSheet" class="view" hidden>
      <div class="sheet-head" id="sheetHead"></div>
      <div class="sheet-scroll" id="sheetScroll"><table class="grid" id="grid"></table><div id="more"></div></div>
    </section>
  </main>

  <nav class="sheet-tabs" id="tabbar" hidden>
    <div class="tab-list" id="tabs" role="tablist"></div>
    <div class="bar-right">
      <span class="status" id="status"></span>
      <a class="text-link" id="openInSheets" target="_blank" rel="noopener">open in google sheets</a>
      <button class="text-link" id="pickFile" type="button">open file</button>
      <button class="text-link" id="signOut" type="button">sign out</button>
    </div>
  </nav>

  <div class="tip" id="tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
