<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com https://*.google.com; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://content.googleapis.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1795457984">
</head>
<body>

  <section id="gate" class="gate">
    <div class="gate-box">
      <p class="gate-title">conversion alchemy finance</p>
      <button class="primary-button" id="signIn" type="button">sign in with google</button>
      <p class="gate-error" id="gateError" hidden></p>
    </div>
  </section>

  <header class="top" id="top" hidden>
    <div class="brand">
      <button class="brand-button" id="brandButton" type="button" aria-haspopup="true" aria-expanded="false"><b id="brandName">finance</b> ▾</button>
      <div class="menu" id="brandMenu" hidden>
        <button type="button" id="pickFile">open file</button>
        <a id="openInSheets" target="_blank" rel="noopener">open in google sheets</a>
        <button type="button" id="signOut">sign out</button>
      </div>
      <div class="seg mode" id="modePick" role="group" aria-label="business or personal"></div>
      <span class="status" id="status"></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>

  <main id="app" hidden>
    <section id="viewDashboard" class="view dash" hidden>
      <div class="dash-main">
        <div class="filters">
          <b>summary</b>
          <label class="box" id="coBox"><select id="scopePick" aria-label="company"></select></label>
          <div class="seg step" role="group" aria-label="period"><span id="periodPick" class="contents"></span><button type="button" class="prev" aria-label="previous year">‹</button><label><select id="yearPick" aria-label="year"></select></label><button type="button" class="next" aria-label="next year">›</button></div>
          <button class="box" id="monthChip" type="button" hidden></button>
          <button class="box" id="pdfButton" type="button">export</button>
        </div>
        <div class="sec summary"><span></span><div><div id="monthChart"></div><div id="summary"></div></div></div>
        <div class="sec"><b id="flowTitle">revenue and costs</b><div class="split"><div class="pick" id="flowList"></div><div id="flowDetail"></div></div></div>
        <div class="sec" id="investSec" hidden><b>investments</b><div class="split"><div class="pick" id="investList"></div><div id="investDetail"></div></div></div>
        <div class="sec"><b>cash</b><div class="split"><div class="pick" id="cashList"></div><div id="cashDetail"></div></div></div>
      </div>
      <aside class="side-col"><div class="side" id="filingsBox"></div><div class="side" id="tasksBox"></div><div class="side" id="attention"></div></aside>
    </section>
    <section id="viewForecast" class="view fc" hidden>
      <div class="filters">
        <b id="fcTitle">forecast</b>
        <label class="box">starts <input type="month" id="fcStart" aria-label="start month"></label>
        <button class="box" id="fcSheet" type="button">sheet</button>
      </div>
      <div class="sec"><b>inputs</b><div class="split"><div id="fcInRev"></div><div id="fcInCost"></div></div></div>
      <div class="sec"><b>next 12 months</b><div><div id="fcChart" class="chart"></div><div id="fcFigs" class="figs"></div></div></div>
      <div class="sec"><b id="fcProdTitle">by product</b><div class="split"><div class="pick" id="fcProdList"></div><div id="fcProdDetail"></div></div></div>
      <div class="sec"><b>plan against actual</b><div id="fcActual"></div></div>
    </section>
    <section id="viewSheet" class="view" hidden>
      <div class="sheet-head" id="sheetHead"></div>
      <div class="sheet-scroll" id="sheetScroll"><table class="grid" id="grid"></table><div id="more"></div></div>
    </section>
  </main>

  <div class="modal" id="txModal" hidden>
    <div class="modal-box">
      <div class="modal-hd"><b id="txmTitle"></b><i id="txmCount"></i><button class="btn" id="txmCopy" type="button">copy</button><button class="btn" id="txmClose" type="button">close</button></div>
      <div class="modal-body"><table class="grid tx" id="txmGrid"></table></div>
    </div>
  </div>
  <div id="print" class="print"></div>
  <div class="tip" id="tip" hidden></div>
  <script src="app.js?v=1795457984"></script>
</body>
</html>
